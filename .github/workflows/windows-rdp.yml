name: Windows 11 RDP

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'RDP Password'
        required: true
        default: 'Admin@1234'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
        shell: powershell

      - name: Set Admin Password
        run: |
          $user = $env:USERNAME
          net user $user "${{ github.event.inputs.password }}"
          net localgroup "Remote Desktop Users" $user /add
          Write-Host "User: $user"
        shell: powershell

      - name: Download playit.gg
        run: |
          Invoke-WebRequest "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-x86_64.exe" -OutFile "C:\playit.exe"
        shell: powershell

      - name: Start playit tunnel and show info
        run: |
          $job = Start-Job -ScriptBlock {
            & "C:\playit.exe" --secret_key anonymous 2>&1
          }
          Write-Host "Waiting for tunnel..."
          Start-Sleep -Seconds 20
          $output = Receive-Job -Job $job
          Write-Host $output
          Write-Host "==========================================="
          Write-Host " RDP Connection Info"
          Write-Host "==========================================="
          Write-Host " Look above for the tunnel address"
          Write-Host " Username : $env:USERNAME"
          Write-Host " Password : ${{ github.event.inputs.password }}"
          Write-Host " Protocol : TCP over port 443 (HTTPS)"
          Write-Host "==========================================="
        shell: powershell

      - name: Keep alive
        run: Start-Sleep -Seconds 21600
        shell: powershell
