name: Windows 11 RDP

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'RDP Password'
        required: true
        default: 'Admin@1234'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
        shell: powershell

      - name: Set Admin Password
        run: |
          $user = $env:USERNAME
          $pass = "${{ github.event.inputs.password }}"
          net user $user $pass
          net localgroup "Remote Desktop Users" $user /add
          Write-Host "User ready: $user"
        shell: powershell

      - name: Download bore
        run: |
          Invoke-WebRequest "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip" -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath C:\bore
        shell: powershell

      - name: Start bore and show connection info
        run: |
          $job = Start-Job -ScriptBlock {
            & "C:\bore\bore.exe" local 3389 --to bore.pub 2>&1
          }

          Start-Sleep -Seconds 10

          $output = Receive-Job -Job $job
          Write-Host "--- bore output ---"
          Write-Host $output

          $port = ($output | Select-String -Pattern 'bore\.pub:(\d+)').Matches.Groups[1].Value

          Write-Host "==========================================="
          Write-Host " RDP Connection Info"
          Write-Host "==========================================="
          if ($port) {
            Write-Host " Address  : bore.pub:$port"
          } else {
            Write-Host " Look above for: listening at bore.pub:XXXXX"
          }
          Write-Host " Username : $env:USERNAME"
          Write-Host " Password : ${{ github.event.inputs.password }}"
          Write-Host "==========================================="
        shell: powershell

      - name: Keep alive
        run: Start-Sleep -Seconds 21600
        shell: powershell
