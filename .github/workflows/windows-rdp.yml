name: Windows 11 RDP

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'RDP Password'
        required: true
        default: 'Admin@1234'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
        shell: powershell

      name: Windows 11 RDP

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Session Password (min 6 chars)'
        required: true
        default: 'cloud123'

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Download RustDesk Server
        shell: powershell
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.6/rustdesk-1.2.6-x86_64.exe"
          Invoke-WebRequest -Uri $url -OutFile rustdesk.exe
          Write-Host "RustDesk downloaded."

      - name: Install and Configure RustDesk
        shell: powershell
        run: |
          Start-Process -FilePath rustdesk.exe -ArgumentList "--silent-install" -Wait
          Start-Sleep -Seconds 5
          $rdPath = "C:\Program Files\RustDesk\RustDesk.exe"
          if (-not (Test-Path $rdPath)) {
            $rdPath = "$env:LOCALAPPDATA\Programs\RustDesk\RustDesk.exe"
          }
          Start-Process -FilePath $rdPath
          Start-Sleep -Seconds 10
          $pass = "${{ github.event.inputs.password }}"
          & $rdPath --password $pass
          Start-Sleep -Seconds 5
          $id = & $rdPath --get-id 2>&1
          Write-Host "==========================================="
          Write-Host " RustDesk Connection Info"
          Write-Host "==========================================="
          Write-Host " ID       : $id"
          Write-Host " Password : $pass"
          Write-Host "==========================================="

      - name: Keep alive
        shell: powershell
        run: Start-Sleep -Seconds 21300
